name: Collect H700 Bionic runtime

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/collect-h700-runtime.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Collect glibc 2.27 compatible libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/runtime-addons"
          docker pull ubuntu:18.04
          docker run --rm             -v "$GITHUB_WORKSPACE/runtime-addons:/out"             ubuntu:18.04 bash -lc '
              set -euxo pipefail
              cat >/etc/apt/sources.list <<EOF
          deb http://ports.ubuntu.com/ubuntu-ports bionic main universe
          deb http://ports.ubuntu.com/ubuntu-ports bionic-updates main universe
          deb http://ports.ubuntu.com/ubuntu-ports bionic-security main universe
          EOF
              apt-get update
              apt-get install -y --no-install-recommends                 binutils file                 libopenal1 libjpeg8 libogg0 libvorbis0a libvorbisfile3
              for lib in                 libopenal.so.1                 libjpeg.so.8                 libogg.so.0                 libvorbis.so.0                 libvorbisfile.so.3
              do
                p="$(find /usr/lib/aarch64-linux-gnu /lib/aarch64-linux-gnu -name "$lib" -print -quit)"
                test -n "$p"
                cp -L "$p" "/out/$lib"
              done
              {
                for f in /out/*.so*; do
                  echo "### $(basename "$f")"
                  file "$f"
                  readelf -d "$f" | sed -n "s/.*Shared library: \[\(.*\)\]/NEEDED \1/p"
                  readelf --version-info "$f" 2>/dev/null | grep -o "GLIBC_[0-9.]*" | sort -Vu | tail -1 || true
                  echo
                done
              } >/out/runtime-report.txt
            '

      - name: Upload runtime add-ons
        uses: actions/upload-artifact@v4
        with:
          name: openxray-h700-bionic-runtime-addons
          path: runtime-addons/
          if-no-files-found: error
          retention-days: 30
