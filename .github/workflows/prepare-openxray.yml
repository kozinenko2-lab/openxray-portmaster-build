name: Prepare OpenXRay source bundle

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/prepare-openxray.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pinned OpenXRay source with submodules
        uses: actions/checkout@v4
        with:
          repository: lesad710/openxray-android
          ref: d2d54dabecae68b27603cd869d9fc7bd38a325f1
          submodules: recursive
          fetch-depth: 1
          path: openxray

      - name: Record source and submodule revisions
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "OpenXRay commit:"
            git -C openxray rev-parse HEAD
            echo
            echo "Submodules:"
            git -C openxray submodule status --recursive
          } | tee openxray-source-revisions.txt

      - name: Verify required ARM64/GLES submodules
        shell: bash
        run: |
          set -euxo pipefail
          for d in \
            Externals/LuaJIT \
            Externals/luabind \
            Externals/GameSpy \
            Externals/gli \
            Externals/sse2neon \
            Externals/imgui \
            Externals/xrLuaFix
          do
            test -d "openxray/$d"
            test -n "$(find "openxray/$d" -mindepth 1 -maxdepth 1 -print -quit)"
          done

      - name: Remove Git metadata and create source bundle
        shell: bash
        run: |
          set -euxo pipefail
          find openxray -name .git -print0 | xargs -0 -r rm -rf
          tar --zstd -cf openxray-arm-linux-with-submodules.tar.zst \
            openxray openxray-source-revisions.txt
          sha256sum openxray-arm-linux-with-submodules.tar.zst \
            > openxray-arm-linux-with-submodules.tar.zst.sha256
          ls -lh openxray-arm-linux-with-submodules.tar.zst

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: openxray-arm-linux-with-submodules
          path: |
            openxray-arm-linux-with-submodules.tar.zst
            openxray-arm-linux-with-submodules.tar.zst.sha256
            openxray-source-revisions.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
