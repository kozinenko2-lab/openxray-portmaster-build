name: Build AirXonix Android
on:
  push:
    branches:
      - airxonix-r367-h700-android
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | head -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Extract source archive
        run: |
          python3 -c "import zipfile; zipfile.ZipFile('AirXonix-H700-Android-r373-public-source.zip').extractall('build_source')"
          test -s build_source/AirXonix-Android-r367/build.gradle
          test -s build_source/AirXonix-Android-r367/settings.gradle
      - name: Generate clean-room assets
        working-directory: build_source/AirXonix-Android-r367
        run: |
          python3 -m pip install --disable-pip-version-check numpy pillow
          python3 native/tools/generate_cleanroom_resources.py generated/cleanroom
          mkdir -p app/src/main/assets
          cp generated/AirXonix-cleanroom.zip app/src/main/assets/AirXonix-cleanroom.zip
      - name: Prepare official SDL2
        working-directory: build_source/AirXonix-Android-r367
        run: bash scripts/prepare_sdl2.sh
      - name: Verify r373 Android isolated input
        working-directory: build_source/AirXonix-Android-r367
        shell: bash
        run: |
          python3 scripts/check_android_isolation_r373.py
          c++ -std=c++17 -I native/src native/tests/test_android_keyboard_r370.cpp -o /tmp/test_android_keyboard_r370
          /tmp/test_android_keyboard_r370
          cmake -S native -B build-native-tests -DAIRXONIX_BUILD_RUNTIME=OFF -DAIRXONIX_BUILD_TESTS=ON
          cmake --build build-native-tests --target test_android_touch_boot_r373 test_android_virtual_input_r372 test_android_touch_bridge_r371 -j 2
          ctest --test-dir build-native-tests -R 'android_touch_boot_r373|android_virtual_input_r372|android_touch_bridge_r371' --output-on-failure
      - name: Export APK signing tools for offline personal packaging
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p signing-kit
          cp "$SDK_DIR/build-tools/35.0.0/lib/apksigner.jar" signing-kit/apksigner.jar
          cp "$SDK_DIR/build-tools/35.0.0/apksigner" signing-kit/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: AirXonix-signing-kit
          path: signing-kit/
          if-no-files-found: error
      - name: Build ARM64 APK
        working-directory: build_source/AirXonix-Android-r367
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AirXonix-Android-r373-ARM64-cleanroom
          path: build_source/AirXonix-Android-r367/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
