name: EKA2L1 H700 PortMaster CI

on:
  push:
    branches:
      - eka2l1-h700-ci
  workflow_dispatch:

jobs:
  build-h700:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout CI harness
        uses: actions/checkout@v4
        with:
          ref: eka2l1-h700-ci

      - name: Clone pinned EKA2L1 with submodules
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf eka2l1
          git clone https://github.com/EKA2L1/EKA2L1.git eka2l1
          cd eka2l1
          git checkout 11f5b6cd141c0884a130ee45743f1f5e17bb1783
          git submodule update --init --recursive
          patch -p1 < ../eka2l1-ci/EKA2L1-PortMaster-H700-v2.patch
          git status --short

      - name: Cache Arm GCC 11.3
        uses: actions/cache@v4
        with:
          path: .cache/arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          key: arm-gcc11.3-rel1-aarch64-linux-gnu-50cdef6c

      - name: Build in H700 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          docker pull ghcr.io/loveretro/h700-toolchain:latest
          docker run --rm \
            -v "$PWD:/root/workspace" \
            -w /root/workspace/eka2l1 \
            ghcr.io/loveretro/h700-toolchain:latest \
            bash -lc '
              set -euxo pipefail
              echo "CC=$CC"
              echo "CXX=$CXX"
              echo "SYSROOT=$SYSROOT"
              echo "CMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"
              "$CC" --version
              git config --global --add safe.directory /root/workspace/eka2l1

              # Current Dynarmic/Oaknut needs a C++20 standard library (<bit>, <compare>).
              # Keep the proven LoveRetro H700 sysroot/SDL stack, but use Arm GCC 11.3.
              mkdir -p /root/workspace/.cache /root/workspace/ci-artifacts
              GCC11_ARCHIVE=/root/workspace/.cache/arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
              GCC11_DIR=/opt/arm-gcc11
              GCC11_URL="https://developer.arm.com/-/media/Files/downloads/gnu/11.3.rel1/binrel/arm-gnu-toolchain-11.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
              GCC11_SHA256="50cdef6c5baddaa00f60502cc8b59cc11065306ae575ad2f51e412a9b2a90364"
              rm -rf "$GCC11_DIR"
              if [ ! -f "$GCC11_ARCHIVE" ]; then
                wget -q --show-progress -O "$GCC11_ARCHIVE" "$GCC11_URL"
              fi
              echo "$GCC11_SHA256  $GCC11_ARCHIVE" | sha256sum -c -
              mkdir -p "$GCC11_DIR"
              tar -xJf "$GCC11_ARCHIVE" -C "$GCC11_DIR" --strip-components=1

              NEW_CC="$GCC11_DIR/bin/aarch64-none-linux-gnu-gcc"
              NEW_CXX="$GCC11_DIR/bin/aarch64-none-linux-gnu-g++"
              NEW_CC_ROOT="$GCC11_DIR/aarch64-none-linux-gnu"
              "$NEW_CXX" --version

              printf "%s\\n" \
                "#include <bit>" \
                "#include <compare>" \
                "#include <cstdint>" \
                "constexpr unsigned f(unsigned x) {" \
                "    return std::popcount(x) + std::countr_zero(x | 1u) + std::rotl(x, 3);" \
                "}" \
                "struct X { int v; auto operator<=>(const X&) const = default; };" \
                "int main() { X a{1}, b{2}; return (a < b && f(3u)) ? 0 : 1; }" \
                > /tmp/cxx20_probe.cpp
              "$NEW_CXX" --sysroot="$SYSROOT" -std=c++20 -mcpu=cortex-a53 -mtune=cortex-a53 \
                /tmp/cxx20_probe.cpp -o /tmp/cxx20_probe
              echo "=== C++20 probe version requirements ==="
              "$GCC11_DIR/bin/aarch64-none-linux-gnu-readelf" -V /tmp/cxx20_probe \
                | grep -E 'GLIBC_|GLIBCXX_|CXXABI_' | tail -40 || true
              LIBSTDCPP="$("$NEW_CXX" --print-file-name=libstdc++.so.6)"
              echo "GCC11 libstdc++: $LIBSTDCPP"
              "$GCC11_DIR/bin/aarch64-none-linux-gnu-readelf" -V "$LIBSTDCPP" \
                | grep -E 'GLIBC_[0-9]' | tail -30 || true

              {
                echo "set(CMAKE_SYSTEM_NAME Linux)"
                echo "set(CMAKE_SYSTEM_VERSION 1)"
                echo "set(CMAKE_SYSTEM_PROCESSOR aarch64)"
                echo "set(CMAKE_C_COMPILER \"$NEW_CC\")"
                echo "set(CMAKE_CXX_COMPILER \"$NEW_CXX\")"
                echo "set(CMAKE_SYSROOT \"$SYSROOT\")"
                echo "list(APPEND CMAKE_FIND_ROOT_PATH \"$PREFIX_LOCAL\" \"$SYSROOT\" \"$NEW_CC_ROOT\")"
                echo "set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)"
                echo "set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)"
                echo "set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)"
              } > /tmp/eka2l1-gcc11-h700.cmake

              # Bundle the matching GCC 11 runtime; H700 has glibc 2.35 but may
              # not ship a new-enough GLIBCXX symbol set.
              LIBSTDCPP_REAL="$("$NEW_CXX" --print-file-name=libstdc++.so.6)"
              LIBGCC_REAL="$("$NEW_CXX" --print-file-name=libgcc_s.so.1)"
              cp -L "$LIBSTDCPP_REAL" /root/workspace/ci-artifacts/libstdc++.so.6
              cp -L "$LIBGCC_REAL" /root/workspace/ci-artifacts/libgcc_s.so.1

              mkdir -p build-h700
              cmake -S . -B build-h700 -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_TOOLCHAIN_FILE=/tmp/eka2l1-gcc11-h700.cmake \
                -DCMAKE_PREFIX_PATH="$PREFIX_LOCAL" \
                -DCMAKE_C_FLAGS="-mcpu=cortex-a53 -mtune=cortex-a53" \
                -DCMAKE_CXX_FLAGS="-mcpu=cortex-a53 -mtune=cortex-a53" \
                -DEKA2L1_PORTMASTER=ON \
                -DEKA2L1_BUILD_TESTS=OFF \
                -DEKA2L1_BUILD_TOOLS=OFF \
                -DEKA2L1_BUILD_PATCH=OFF \
                -DEKA2L1_ENABLE_DISCORD_RICH_PRESENCE=OFF \
                2>&1 | tee build-h700/configure.log
              cmake --build build-h700 --target eka2l1_portmaster -j2 \
                2>&1 | tee build-h700/build.log
              file build-h700/bin/eka2l1_portmaster || true
              readelf -h build-h700/bin/eka2l1_portmaster || true
              readelf -d build-h700/bin/eka2l1_portmaster || true
            '

      - name: Stage diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          cp -f eka2l1/build-h700/configure.log ci-artifacts/ 2>/dev/null || true
          cp -f eka2l1/build-h700/build.log ci-artifacts/ 2>/dev/null || true
          cp -f eka2l1/build-h700/bin/eka2l1_portmaster ci-artifacts/ 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eka2l1-h700-ci
          path: ci-artifacts/
          if-no-files-found: warn
