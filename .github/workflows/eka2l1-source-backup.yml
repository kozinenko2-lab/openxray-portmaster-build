name: EKA2L1 H700 Source Backup v3

on:
  push:
    branches:
      - eka2l1-h700-backup-v3
    paths:
      - '.github/workflows/eka2l1-source-backup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout backup branch
        uses: actions/checkout@v4
        with:
          ref: eka2l1-h700-backup-v3
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact PortMaster source tree
        shell: bash
        run: |
          set -euxo pipefail
          BASE_COMMIT=11f5b6cd141c0884a130ee45743f1f5e17bb1783
          rm -rf source-snapshot
          git clone --no-recurse-submodules https://github.com/EKA2L1/EKA2L1.git source-snapshot
          cd source-snapshot
          git checkout "$BASE_COMMIT"
          patch -p1 --batch --forward < ../eka2l1-ci/EKA2L1-PortMaster-H700-v2.patch

          test -f src/emu/portmaster/src/main.cpp
          test -f src/emu/portmaster/src/platform_stubs.cpp
          test -f src/emu/portmaster/src/state.cpp
          test -f portmaster/EKA2L1.sh
          test -f PORTMASTER_SUBMODULES.lock

          # Keep the source snapshot independent of Git metadata. Exact upstream
          # and submodule revisions are preserved in BACKUP_INFO and lock files.
          rm -rf .git

      - name: Create persistent source backup
        shell: bash
        run: |
          set -euxo pipefail
          OUT=backups/EKA2L1-PortMaster-H700-v3
          rm -rf "$OUT"
          mkdir -p "$OUT"

          tar -czf "$OUT/EKA2L1-PortMaster-H700-v3-source.tar.gz" source-snapshot
          sha256sum "$OUT/EKA2L1-PortMaster-H700-v3-source.tar.gz" > "$OUT/EKA2L1-PortMaster-H700-v3-source.tar.gz.sha256"

          cp eka2l1-ci/EKA2L1-PortMaster-H700-v2.patch "$OUT/EKA2L1-PortMaster-H700-v3.patch"
          cp eka2l1-ci/build-h700.sh "$OUT/build-h700.sh"
          cp source-snapshot/PORTMASTER_SUBMODULES.lock "$OUT/PORTMASTER_SUBMODULES.lock"
          cp source-snapshot/scripts/fetch_portmaster_submodules.sh "$OUT/fetch_portmaster_submodules.sh"

          cat > "$OUT/README_RESTORE_RU.md" <<'EOF'
          # EKA2L1 PortMaster H700 v3 — резервная копия

          Это постоянная резервная копия исходников порта EKA2L1 для ARM64/H700.

          Основа upstream:
          - repository: EKA2L1/EKA2L1
          - commit: 11f5b6cd141c0884a130ee45743f1f5e17bb1783

          Проверенная H700 сборка:
          - source/CI branch: eka2l1-h700-v3
          - successful build run: 37865300058
          - successful package run: 37867681647
          - target: AArch64 / H700 / SDL2 Mali fbdev / native OpenGL ES 3
          - maximum required glibc: GLIBC_2.35

          ## Восстановление

          Вариант 1 — готовый снимок:
          1. Распаковать EKA2L1-PortMaster-H700-v3-source.tar.gz.
          2. Перейти в source-snapshot.
          3. Запустить scripts/fetch_portmaster_submodules.sh для восстановления точных third-party submodules.
          4. Использовать build-h700.sh/CI как ориентир для сборки.

          Вариант 2 — восстановление с upstream:
          1. checkout upstream commit 11f5b6cd141c0884a130ee45743f1f5e17bb1783.
          2. Применить EKA2L1-PortMaster-H700-v3.patch через patch -p1.
          3. Восстановить submodules по PORTMASTER_SUBMODULES.lock.

          Архив специально не содержит содержимое third-party git submodules, чтобы
          резерв оставался компактным. Их точные gitlink SHA зафиксированы в lock-файле.
          EOF

          cat > "$OUT/BACKUP_INFO.txt" <<'EOF'
          EKA2L1 PortMaster H700 v3 source backup
          Upstream commit: 11f5b6cd141c0884a130ee45743f1f5e17bb1783
          Source branch: eka2l1-h700-v3
          Backup branch: eka2l1-h700-backup-v3
          Successful build run: 37865300058
          Successful package run: 37867681647
          Architecture: AArch64
          Target: Allwinner H700 / PortMaster
          Graphics: native OpenGL ES 3 via SDL2 Mali fbdev
          ABI ceiling verified: GLIBC_2.35
          EOF

          echo "Backup size:"
          ls -lh "$OUT"
          echo "Archive contents sanity:"
          tar -tzf "$OUT/EKA2L1-PortMaster-H700-v3-source.tar.gz" | grep -E 'src/emu/portmaster/src/(main|state|platform_stubs)\.cpp|portmaster/EKA2L1\.sh' | head -20

          size=$(stat -c%s "$OUT/EKA2L1-PortMaster-H700-v3-source.tar.gz")
          if [ "$size" -ge 95000000 ]; then
            echo "ERROR: backup archive is too large for a normal GitHub blob: $size bytes" >&2
            exit 1
          fi

      - name: Commit backup into GitHub
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/EKA2L1-PortMaster-H700-v3
          git commit -m "Backup EKA2L1 PortMaster H700 v3 source snapshot"
          git push origin HEAD:eka2l1-h700-backup-v3
